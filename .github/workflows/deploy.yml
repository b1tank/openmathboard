name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openmathboard-cloudflare-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build application
        run: npm run build

      - name: Install browser matrix
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser tests
        run: npm test

      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 12); do
            if [ "$(curl --fail --silent --show-error --max-time 10 https://openmathboard.openmathboard.workers.dev/health)" = "OK" ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1
